<script type="module">
import * as THREE from 'three';
import {loadFaces} from './avatar.js';
import {findClips} from './clips.js';

import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
await loadFaces(await (await fetch('faces/index.json')).json());
const q0=new URLSearchParams(location.search); const {SHOTS}=await import(`../episodes/${q0.get('ep')}/shots.js`);
await document.fonts.load('600 40px Inter');
const q=new URLSearchParams(location.search); const W=+(q.get('w')||1080), H=+(q.get('h')||1920);

fragmentShader:`uniform sampler2D tDiffuse; uniform float time; uniform vec2 res; uniform float night; uniform float flash; varying vec2 vUv;

  c+=sh*(1.0-smoothstep(0.0,0.5,l)) + hi*smoothstep(0.45,1.0,l);
  // gentle S-curve contrast
  c=mix(c, c*c*(3.0-2.0*c), 0.35);
  // saturation
  float l2=dot(c,vec3(0.2126,0.7152,0.0722)); c=mix(vec3(l2),c,1.12);
  // flashback: warm, faded, dreamy
  float lf=dot(c,vec3(0.299,0.587,0.114)); c=mix(c, mix(vec3(lf),c,0.3)*vec3(1.12,0.97,0.78)+0.07, flash);
  // vignette
  vec2 q=vUv-0.5; q.x*=res.x/res.y; float v=smoothstep(0.85,0.25,length(q)*1.25); c*=mix(mix(0.62,0.45,flash),1.0,v);

  c+= (h(vUv*res+time*97.0)-0.5)*0.035;

const gp=new ShaderPass(Grade); comp.addPass(gp);

window.setSpans=(sp)=>{window.SPANS=sp;};
window.renderShot=(i,lt,dur)=>{
  if(i!==cur){ if(S) disposeScene(S); S=new THREE.Scene(); upd=SHOTS[i](S,cam); cur=i; }

};
